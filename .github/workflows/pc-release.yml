name: PC release packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            runner: ubuntu-24.04
          - system: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Whether the repository has a VirusTotal key; the key itself is
      # handed only to the step that uses it.
      VT_ENABLED: ${{ secrets.VT_API_KEY != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-14 gcc-multilib clang lld cmake ninja-build libpng-dev
      - name: Use GCC 14 for the game sources
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/pc-compiler"
          ln -s /usr/bin/gcc-14 "$RUNNER_TEMP/pc-compiler/gcc"
          echo "$RUNNER_TEMP/pc-compiler" >> "$GITHUB_PATH"
      - name: Cache Linux dependencies
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            tmp/pc/linux-sysroot
            tmp/pc/linux-sysroot-downloads
            tmp/pc/sdl-source
            tmp/pc/sdl-m32-portable
          key: release-linux-${{ runner.os }}-${{ hashFiles('tools/pc/build_linux_sysroot.py', 'tools/pc/fetch_tools.py') }}
      - name: Cache Windows dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            tmp/pc/llvm-mingw
            tmp/pc/win32-deps
          key: release-windows-${{ runner.os }}-${{ hashFiles('tools/pc/build_win32_deps.py', 'tools/pc/fetch_tools.py') }}
      - name: Archive version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "PACKAGE_VERSION=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          fi
      # Public runners never receive a game ROM. The regular PC workflow
      # runs the full adapter suite; this checks setup and the archives.
      - name: Build and package
        run: python tools/pc/package.py "${{ matrix.system }}" --skip-smoke --version "$PACKAGE_VERSION"
      - name: Test archive structure
        run: python tools/pc/test_package.py --archives dist
      # The SDK just built against every release in tools/pc/mod_compat.txt:
      # a mod made with one of them must still load and run (no disc needed).
      - name: Mods from earlier releases
        if: runner.os == 'Linux'
        run: python tools/pc/check_mod_abi.py
      # The FM Editor as one program (tools/pc/fm_editor/README.md), in an
      # archive of its own: it unpacks into the same folder as the game's,
      # beside memories-pc(.exe), where it finds game/.
      # On Windows a folder (fm-editor.exe + fm-editor-files/), and the
      # PyInstaller loader compiled here rather than the prebuilt one that
      # malware shares: virus scanners flagged the one-file build.
      - name: FM Editor (Windows)
        if: runner.os == 'Windows'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --no-binary pyinstaller pyinstaller==6.18.0
          python tools/pc/fm_editor/build_exe.py --dist tmp/fm-editor --version "$PACKAGE_VERSION"
          python - <<'EOF'
          import os, zipfile
          version = os.environ["PACKAGE_VERSION"]
          folder = f"yfm-redecomp-{version}"
          with zipfile.ZipFile(f"dist/fm-editor-{version}-windows.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for directory, _, files in os.walk("tmp/fm-editor/fm-editor"):
                  for name in sorted(files):
                      path = os.path.join(directory, name)
                      archive.write(path, f"{folder}/{os.path.relpath(path, 'tmp/fm-editor/fm-editor')}".replace(os.sep, "/"))
              archive.write("tools/pc/fm_editor/README.md", f"{folder}/fm-editor-README.md")
          EOF
      # The shipped programs on VirusTotal (notes/pc-release.md, "VirusTotal"):
      # uploaded, so only for release builds: tags and manual runs, never
      # pull requests (whose builds are not public, and which may carry
      # anyone's code) nor every push to master (the free tier's quota).
      # Skipped without the VT_API_KEY secret (forks). Detections only warn;
      # the table goes to the job summary. McAfeeD's reputation verdict
      # (ti!<hash>) is on every new file, hence a threshold above 0.
      - name: VirusTotal
        if: runner.os == 'Windows' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && env.VT_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_MAX_DETECTIONS: "2"
        run: |
          python - <<'EOF'
          import os, zipfile
          version = os.environ["PACKAGE_VERSION"]
          target = os.path.join(os.environ["RUNNER_TEMP"], "vt")
          os.makedirs(target, exist_ok=True)
          for archive, name in ((f"dist/yfm-redecomp-{version}-windows.zip", "/memories-pc.exe"),
                                (f"dist/fm-editor-{version}-windows.zip", "/fm-editor.exe")):
              with zipfile.ZipFile(archive) as package:
                  member = next(entry for entry in package.namelist() if entry.endswith(name))
                  with open(os.path.join(target, name[1:]), "wb") as handle:
                      handle.write(package.read(member))
          EOF
          status=0
          # --timeout 600: two new files' analyses still leave the step's
          # 30 minutes room to write the summary.
          python tools/pc/vt_check.py --max "$VT_MAX_DETECTIONS" --timeout 600 \
            --markdown "$RUNNER_TEMP/vt.md" --label memories-pc.exe --label fm-editor.exe \
            "$RUNNER_TEMP/vt/memories-pc.exe" "$RUNNER_TEMP/vt/fm-editor.exe" || status=$?
          {
            echo "### VirusTotal ($PACKAGE_VERSION)"
            echo
            if [ -f "$RUNNER_TEMP/vt.md" ]; then cat "$RUNNER_TEMP/vt.md"; else echo "The check did not finish (exit $status); see the step log."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          case $status in
            0) ;;
            1) echo "::warning title=VirusTotal::a shipped program has more than $VT_MAX_DETECTIONS detections (job summary)" ;;
            *) echo "::warning title=VirusTotal::the check failed (exit $status); see the step log" ;;
          esac
      # Built in Debian 11, like the game (tools/pc/build_linux_sysroot.py):
      # a program built on the runner would ask for Ubuntu 24.04's glibc.
      # The python image carries Tk, which PyInstaller bundles.
      - name: FM Editor (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e PACKAGE_VERSION -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" python:3.12-bullseye sh -ec '
            python -m pip install --root-user-action=ignore pyinstaller==6.18.0
            python tools/pc/fm_editor/build_exe.py --dist tmp/fm-editor
            python - <<EOF
          import os, tarfile
          version = os.environ["PACKAGE_VERSION"]
          folder = f"yfm-redecomp-{version}"
          def mode(value):
              return lambda info: (setattr(info, "mode", value), setattr(info, "uid", 0), setattr(info, "gid", 0), setattr(info, "uname", ""), setattr(info, "gname", ""), info)[-1]
          with tarfile.open(f"dist/fm-editor-{version}-linux.tar.gz", "w:gz", compresslevel=9) as archive:
              archive.add("tmp/fm-editor/fm-editor", f"{folder}/fm-editor", filter=mode(0o755))
              archive.add("tools/pc/fm_editor/README.md", f"{folder}/fm-editor-README.md", filter=mode(0o644))
          EOF
            chown -R "$HOST_UID:$HOST_GID" tmp/fm-editor dist'
      - name: ROM setup tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B tmp/release-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build tmp/release-tests --target memories_game_files_test memories_scratch_sweep_test
          ctest --test-dir tmp/release-tests -R '^pc_game_files_' --output-on-failure
      - name: Upload installable archives
        uses: actions/upload-artifact@v4
        with:
          name: yfm-redecomp-${{ matrix.system }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yfm-redecomp-*
          merge-multiple: true
          path: release
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        # A tag with a hyphen (v0.2.0-preview.1, v0.2.0-rc.1) is a preview:
        # its draft is marked as a pre-release. A plain v0.2.0 is a release.
        run: |
          case "$RELEASE_TAG" in *-*) kind=--prerelease ;; *) kind=--prerelease=false ;; esac
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published release"'
            gh release edit "$RELEASE_TAG" "$kind"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft "$kind" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
